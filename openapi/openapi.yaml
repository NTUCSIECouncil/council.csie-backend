openapi: 3.1.0
info:
  title: Council CSIE API
  version: 1.0.0
  description: |
    RESTful API for the NTU CSIE student council website (council.csie.ntu.edu.tw).
    Provides a platform for students to share course reviews, access exam materials, and manage user profiles.
    This specification follows OpenAPI 3.1.0 standards with modular organization for maintainability.
servers:
  - url: /api
    description: Main API server

tags:
  - name: articles
    description: Course review articles and content management
  - name: courses
    description: Academic course information and metadata
  - name: quizzes
    description: Exam materials and quiz file management
  - name: tags
    description: Content categorization and tagging system
  - name: users
    description: User accounts and profile management

paths:
  /articles:
    $ref: './paths/articles.yaml#/articles'
  /articles/{articleId}:
    $ref: './paths/articles.yaml#/articles_articleId'
  /articles/{articleId}/file:
    $ref: './paths/articles.yaml#/articles_articleId_file'
  /courses:
    $ref: './paths/courses.yaml#/courses'
  /courses/{courseId}:
    $ref: './paths/courses.yaml#/courses_courseId'
  /courses/{courseId}/quizzes:
    $ref: './paths/courses.yaml#/courses_courseId_quizzes'
  /quizzes:
    $ref: './paths/quizzes.yaml#/quizzes'
  /quizzes/{quizId}:
    $ref: './paths/quizzes.yaml#/quizzes_quizId'
  /quizzes/{quizId}/file:
    $ref: './paths/quizzes.yaml#/quizzes_quizId_file'
  /tags:
    $ref: './paths/tags.yaml#/tags'
  /users:
    $ref: './paths/users.yaml#/users'
  /users/{userId}:
    $ref: './paths/users.yaml#/users_userId'
  /users/me:
    $ref: './paths/users.yaml#/users_me'
  /users/me/private:
    $ref: './paths/users.yaml#/users_me_private'

components:
  schemas:
    $ref: './components/schemas.yaml'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Authentication using Firebase ID Token. Include the token in the Authorization 
        header as `Bearer <Firebase_ID_Token>`.
