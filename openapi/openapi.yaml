openapi: 3.1.0
info:
  title: council.csie API
  version: 1.0.0
  description: Modular OpenAPI 3.1.0 spec for council.csie, organized by resource.
servers:
  - url: /api
    description: Main API server

tags:
  - name: articles
    description: Operations about articles
  - name: courses
    description: Operations about courses
  - name: quizzes
    description: Operations about quizzes
  - name: tags
    description: Operations about tags
  - name: users
    description: Operations about users

paths:
  /articles:
    $ref: "./paths/articles.yaml#/articles"
  /articles/{articleId}:
    $ref: "./paths/articles.yaml#/articles_articleId"
  /articles/{articleId}/file:
    $ref: "./paths/articles.yaml#/articles_articleId_file"
  /courses:
    $ref: "./paths/courses.yaml#/courses"
  /courses/{courseId}:
    $ref: "./paths/courses.yaml#/courses_courseId"
  /courses/{courseId}/quizzes:
    $ref: "./paths/courses.yaml#/courses_courseId_quizzes"
  /courses/{curriculum}/quizzes:
    $ref: "./paths/courses.yaml#/courses_curriculum_quizzes"
  /quizzes:
    $ref: "./paths/quizzes.yaml#/quizzes"
  /quizzes/{quizId}:
    $ref: "./paths/quizzes.yaml#/quizzes_quizId"
  /quizzes/{quizId}/file:
    $ref: "./paths/quizzes.yaml#/quizzes_quizId_file"
  /tags:
    $ref: "./paths/tags.yaml#/tags"
  /users:
    $ref: "./paths/users.yaml#/users"
  /users/{userId}:
    $ref: "./paths/users.yaml#/users_userId"
  /users/me:
    $ref: "./paths/users.yaml#/users_me"
  /users/me/private:
    $ref: "./paths/users.yaml#/users_me_private"

components:
  schemas:
    $ref: "./components/schemas.yaml"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Use `Bearer <Firebase ID Token>` as the value for the `Authorization` header.
