UUID:
  type: string
  format: uuid
  description: Universally unique identifier

Article:
  type: object
  description: Article resource object
  properties:
    _id: { $ref: "#/UUID" }
    title:
      type: string,
      description: "Article title"
      example: "I'm totally obsessed with DSA"
    tags:
      type: array,
      items: { type: string }
      description: "Tags for the article"
      example: ["DSA", "GOAT", "cool"]
    ratings:
      type: object
      description: Ratings for the course
      properties:
        sweetness:
          type: integer
          description: "Sweetness rating"
          minimum: 1
          maximum: 5
          example: 4
        coolness:
          type: integer
          description: "Coolness rating"
          minimum: 1
          maximum: 5
          example: 5
        usefulness:
          type: integer
          description: "Usefulness rating"
          minimum: 1
          maximum: 5
          example: 3
    course: { $ref: "#/UUID" }
    creator: { $ref: "#/UUID" }
  required: [_id, course, creator, title, tags, ratings]

Course:
  type: object
  description: Course resource object
  properties:
    _id: { $ref: "#/UUID" }
    curriculum:
      type: string
      description: "Course code"
      example: "CSIE1212"
    lecturer: { type: string, description: "Lecturer name", example: "HT Lin" }
    class:
      type: [string, "null"]
      description: "Class name or number"
      example: "1"
    names:
      type: array,
      items: { type: string }
      description: "Course names"
      example: ["Data Structures and Algorithms"]
    credit: { type: integer, description: "Course credit", example: 3 }
    semester: { type: string, description: "Semester code", example: "113-2" }
  required: [_id, curriculum, lecturer, names, credit]

Quiz:
  type: object
  description: Quiz resource object
  properties:
    _id: { $ref: "#/UUID" }
    session:
      type: string
      enum: [midterm, final, first, second]
      description: Quiz session type
      example: "midterm"
    course: { $ref: "#/UUID" }
    uploader: { $ref: "#/UUID" }
  required: [_id, course, uploader, session]

User:
  type: object
  description: User resource object
  properties:
    _id: { type: string, description: "User ID", example: "1234567890" }
    email:
      type: string
      description: "User email"
      example: "boss-wang@example.com"
    name: { type: string, description: "User name", example: "Claud Wang" }
    nickname:
      { type: string, description: "User nickname", example: "Boss Wang" }
  required: [_id, email, name, nickname]

Meta:
  type: object
  description: Metadata for paginated responses
  properties:
    total: { type: integer, description: "Total number of items" }
    offset: { type: integer, description: "Offset for pagination" }
    limit: { type: integer, description: "Limit for pagination" }
  required: [total, offset, limit]

ArticleWithEmbeds:
  allOf:
    - $ref: "#/Article"
    - type: object
      properties:
        course: { $ref: "#/Course" }
        creator: { $ref: "#/User" }
        content:
          type: string
          description: "First 50 characters of the article"
          example: "This is a sample article content that is very long and goes on and on..."

QuizWithEmbeds:
  allOf:
    - $ref: "#/Quiz"
    - type: object
      properties:
        course: { $ref: "#/Course" }
        uploader: { $ref: "#/User" }

CourseListResponse:
  type: object
  description: List response for courses
  properties:
    courses:
      type: array
      items: { $ref: "#/Course" }
      description: List of courses
    meta: { $ref: "#/Meta" }
  required: [courses, meta]

QuizListResponse:
  type: object
  description: List response for quizzes
  properties:
    quizzes:
      type: array
      items: { $ref: "#/Quiz" }
      description: List of quizzes
    meta: { $ref: "#/Meta" }
  required: [quizzes, meta]

StringArrayResponse:
  type: object
  description: List response for tags
  properties:
    tags:
      type: array
      items: { type: string }
      description: List of tags
  required: [tags]

Error:
  type: object
  description: Standard error response object.
  properties:
    message:
      type: string
      description: Human-readable error message describing what went wrong.
      example: "Validation failed: 'title' is required."
    code:
      type: string
      description: Machine-readable error code.
      example: validation_failed
    details:
      type: object
      description: Optional additional information about the error.
      example:
        field: title
        reason: "This field is required."
