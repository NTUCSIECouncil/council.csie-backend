UUID:
  type: string
  format: uuid
  description: Unique identifier in UUID format.

Meta:
  type: object
  description: Metadata for paginated responses.
  properties:
    total: { type: integer, description: Total number of items. }
    offset: { type: integer, description: Pagination offset. }
    limit: { type: integer, description: Maximum items per page. }
  required: [total, offset, limit]

ArticleBase:
  type: object
  description: Base attributes of an article.
  properties:
    title:
      type: string
      description: Article title.
      example: "I'm totally obsessed with DSA"
    tags:
      type: array
      items: { type: string }
      description: Tags associated with the article.
      example: ["DSA", "GOAT", "cool"]
    ratings:
      type: object
      description: Ratings for the related course.
      properties:
        sweetness:
          type: integer
          description: Sweetness rating.
          minimum: 1
          maximum: 5
          example: 4
        chill:
          type: integer
          description: Chill rating.
          minimum: 1
          maximum: 5
          example: 5
        teaching:
          type: integer
          description: Teaching quality rating.
          minimum: 1
          maximum: 5
          example: 3
        gain:
          type: integer
          description: Gain rating.
          minimum: 1
          maximum: 5
          example: 4
        recommend:
          type: integer
          description: Recommendation rating.
          minimum: 1
          maximum: 5
          example: 5

ArticleCreate:
  type: object
  description: Payload to create a new article.
  allOf:
    - $ref: "#/ArticleBase"
    - type: object
      properties:
        course: { $ref: "#/UUID" }
  required: [title, tags, ratings, course]

ArticleUpdate:
  type: object
  description: Payload to update an article.
  allOf:
    - $ref: "#/ArticleBase"

ArticleResponse:
  type: object
  description: Article information with optional embedding related data.
  allOf:
    - type: object
      properties:
        _id: { $ref: "#/UUID" }
    - $ref: "#/ArticleBase"
    - type: object
      properties:
        course:
          oneOf:
            - $ref: "#/UUID"
            - $ref: "#/CourseResponse"
        creator:
          oneOf:
            - $ref: "#/UUID"
            - $ref: "#/UserResponse"
        content:
          type: string
          description: First 50 characters of the article content, truncated with an ellipsis if longer. May be an empty string if no file content has been uploaded.
          example: "This is a sample article content that is very long and goes on and on..."
  required: [_id, title, tags, ratings, course, creator]

CourseResponse:
  type: object
  description: Course information.
  properties:
    _id: { $ref: "#/UUID" }
    curriculum:
      type: string
      description: Course code.
      example: "CSIE1212"
    lecturer:
      type: string
      description: Course lecturer name.
      example: "HT Lin"
    class:
      type: string
      description: Class name or number.
      example: "1"
    names:
      type: array
      items: { type: string }
      description: Course names.
      example: ["Data Structures and Algorithms"]
    credit:
      type: integer
      description: Course credit count.
      minimum: 0
      example: 3
    semester:
      type: string
      description: Semester code.
      example: "113-2"
  required: [_id, curriculum, lecturer, names, credit, semester]

QuizResponse:
  type: object
  description: Quiz information.
  properties:
    session:
      type: string
      enum: [midterm, final, first, second, other]
      description: Quiz session type.
      example: "midterm"
    course:
      oneOf:
        - $ref: "#/UUID"
        - $ref: "#/CourseResponse"
    uploader:
      oneOf:
        - $ref: "#/UUID"
        - $ref: "#/UserResponse"
  required: [session, course, uploader]

UserBase:
  type: object
  description: Base user attributes.
  properties:
    nickname:
      type: string
      description: User nickname.
      example: "Boss Wang"

UserCreate:
  type: object
  description: Payload to create a user.
  allOf:
    - $ref: "#/UserBase"
  required: [nickname]

UserResponse:
  type: object
  description: Public user information.
  allOf:
    - type: object
      properties:
        _id: { $ref: "#/UUID" }
    - $ref: "#/UserBase"
    - type: object
  required: [_id, nickname]

PrivateUserResponse:
  type: object
  description: User information with private details.
  allOf:
    - type: object
      properties:
        _id: { $ref: "#/UUID" }
        gid:
          type: string
          description: User Google ID.
          example: "1234567890"
        email:
          type: string
          format: email
          description: User email address.
          example: "boss-wang@example.com"
        name:
          type: string
          description: User full name.
          example: "Claud Wang"
    - $ref: "#/UserBase"
  required: [_id, nickname, email, name, gid]

Error:
  type: object
  description: Standard error response.
  properties:
    message:
      type: string
      description: Human-readable error message.
      example: "Validation failed: 'title' is required."
    details:
      type: object
      description: Additional error information.
      example:
        field: title
        reason: "This field is required."
