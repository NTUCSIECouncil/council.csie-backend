articles:
  get:
    tags: [articles]
    summary: List and search course review articles
    description: |
      Retrieves a paginated list of course review articles with filtering and search capabilities. 
      Can embed related resources like course details and creator information.
    parameters:
      - name: limit
        in: query
        description: Maximum number of articles to return per page
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - name: offset
        in: query
        description: Number of articles to skip for pagination
        schema:
          type: integer
          default: 0
          minimum: 0
          maximum: 100
      - name: keyword
        in: query
        description: Search term for fuzzy matching against article titles, content, course names, lecturers, and curriculum codes
        schema:
          type: string
          maxLength: 100
      - name: tags
        in: query
        description: Tag(s) to filter articles by
        schema:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 50
        style: form
        explode: true
      - name: embed
        in: query
        description: |
          Related resources to include in the response. When omitted, only UUID references 
          are returned. The 'content' option provides article content preview.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum: [course, creator, content]
    responses:
      '200':
        description: Articles retrieved successfully
        content:
          application/json:
            schema:
              type: object
              description: Paginated list of articles
              properties:
                articles:
                  type: array
                  description: Array of articles matching the search criteria
                  items:
                    $ref: '../components/schemas.yaml#/ArticleResponse'
                meta:
                  $ref: '../components/schemas.yaml#/Meta'
              required: [articles, meta]
      '400':
        description: Invalid request parameters
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
  post:
    tags: [articles]
    summary: Create a new course review article
    description: |
      Creates a new course review article. Requires authentication, and the authenticated 
      user becomes the article creator.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ArticleCreate'

    responses:
      '201':
        description: Article created successfully
        content:
          application/json:
            schema:
              type: object
              description: Article creation response
              properties:
                articleId:
                  $ref: '../components/schemas.yaml#/UUID'
              required: [articleId]
      '400':
        description: Invalid request body or parameters
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'

articles_articleId:
  get:
    tags: [articles]
    summary: Get article by ID
    description: |
      Retrieves a single article by its unique identifier. 
      Can optionally embed related resources like course details and creator information.
    parameters:
      - name: articleId
        in: path
        required: true
        description: Unique identifier of the article to retrieve
        schema:
          $ref: '../components/schemas.yaml#/UUID'
      - name: embed
        in: query
        description: |
          Related resources to include in the response. When omitted, only UUID references 
          are returned. The 'content' option provides article content preview.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum: [course, creator, content]
    responses:
      '200':
        description: Article retrieved successfully
        content:
          application/json:
            schema:
              type: object
              description: Single article response
              properties:
                article:
                  $ref: '../components/schemas.yaml#/ArticleResponse'
              required: [article]
      '400':
        description: Invalid article ID or request parameters
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '404':
        description: Article not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
  patch:
    tags: [articles]
    summary: Update article by ID
    description: |
      Updates an existing article with new information. Requires authentication, 
      and only the article creator can modify their own articles.
    security:
      - bearerAuth: []
    parameters:
      - name: articleId
        in: path
        required: true
        description: Unique identifier of the article to update
        schema:
          $ref: '../components/schemas.yaml#/UUID'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ArticleUpdate'
    responses:
      '204':
        description: Article updated successfully
      '400':
        description: Invalid article ID or request body
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '403':
        description: Insufficient permissions to modify this article
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '404':
        description: Article not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'

articles_articleId_file:
  get:
    tags: [articles]
    summary: Get article content file
    description: |
      Retrieves the complete Markdown content for the specified article.
    parameters:
      - name: articleId
        in: path
        required: true
        description: Unique identifier of the article
        schema:
          $ref: '../components/schemas.yaml#/UUID'
    responses:
      '200':
        description: Article content file retrieved successfully
        content:
          application/json:
            schema:
              type: object
              description: Article Markdown content
              properties:
                file:
                  type: string
                  format: markdown
                  description: Complete Markdown content of the article (may be empty if no content has been uploaded)
              required: [file]
      '400':
        description: Invalid article ID
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '404':
        description: Article not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
  put:
    tags: [articles]
    summary: Upload or replace article content
    description: |
      Uploads or replaces the Markdown content for an article. Requires authentication, 
      and only the article creator can upload content to their articles.
    security:
      - bearerAuth: []
    parameters:
      - name: articleId
        in: path
        required: true
        description: Unique identifier of the article
        schema:
          $ref: '../components/schemas.yaml#/UUID'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              file:
                type: string
                format: markdown
                maxLength: 1000000
                description: Markdown content to upload for this article
            required: [file]
    responses:
      '204':
        description: Article content uploaded successfully
      '400':
        description: Invalid article ID or file content
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '403':
        description: Insufficient permissions to modify this article
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '404':
        description: Article not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
