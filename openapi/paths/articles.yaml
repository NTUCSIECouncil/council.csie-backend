articles:
  get:
    tags: [articles]
    summary: Get or search articles
    description: |
      Retrieves a paginated list of articles. Supports keyword search, tag filtering, and embedding related resources (course, creator, content). Includes pagination metadata.
    parameters:
      - name: limit
        in: query
        description: Maximum number of articles to return per page.
        schema:
          type: integer
          default: 10
      - name: offset
        in: query
        description: Number of articles to skip before starting to collect the result set.
        schema:
          type: integer
          default: 0
      - name: keyword
        in: query
        description: Fuzzy search term applied to article title, content, course name, lecturer, and course curriculum.
        schema:
          type: string
      - name: tags
        in: query
        description: List of tags to filter articles by. Multiple tags can be specified.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: embed
        in: query
        description: Specifies which related resources to include in the response. Set any of course, creator, content.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum: [course, creator, content]
    responses:
      "200":
        description: |-
          Success. Returns a paginated list of articles matching the query parameters. Each article may include embedded resources if requested.
        content:
          application/json:
            schema:
              type: object
              description: List response for articles
              properties:
                articles:
                  type: array
                  description: List of articles matching the search criteria
                  items:
                    $ref: "../components/schemas.yaml#/ArticleResponse"
                meta:
                  $ref: "../components/schemas.yaml#/Meta"
              required: [articles, meta]
      "400":
        description: Bad Request. The request could not be processed due to invalid or missing query, path, or body parameters. Returns a standard error object.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Error"
  post:
    tags: [articles]
    summary: Create an article
    description: |
      Creates a new article with the provided data.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../components/schemas.yaml#/ArticleCreate" }

    responses:
      "201":
        description: |-
          Created. The article was successfully created. Returns the ID of the new article.
        content:
          application/json:
            schema:
              type: object
              description: Article creation response
              properties:
                articleId: { $ref: "../components/schemas.yaml#/UUID" }
              required: [articleId]
      "400":
        description: Bad Request. The request could not be processed due to invalid or missing query, path, or body parameters. Returns a standard error object.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Error"

articles_articleId:
  get:
    tags: [articles]
    summary: Get article by ID
    description: |
      Retrieves a single article by its unique ID. Optionally embeds related resources (course, creator, content).
    parameters:
      - name: articleId
        in: path
        required: true
        description: The unique identifier of the article to retrieve.
        schema:
          $ref: "../components/schemas.yaml#/UUID"
      - name: embed
        in: query
        description: Specifies which related resources to include in the response. Set any of course, creator, content.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum: [course, creator, content]
    responses:
      "200":
        description: |-
          Success. Returns the article with the specified ID. May include embedded resources if requested.
        content:
          application/json:
            schema:
              type: object
              description: Article response
              properties:
                article:
                  $ref: "../components/schemas.yaml#/ArticleResponse"
              required: [article]
      "400":
        description: Bad Request. The request could not be processed due to invalid or missing query, path, or body parameters. Returns a standard error object.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Error"
      "404":
        description: Not Found. No article exists with the specified ID.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Error"
  patch:
    tags: [articles]
    summary: Update article by ID
    description: |
      Updates an existing article by its unique ID with the provided data.
    parameters:
      - name: articleId
        in: path
        required: true
        description: The unique identifier of the article to update.
        schema:
          $ref: "../components/schemas.yaml#/UUID"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../components/schemas.yaml#/ArticleUpdate" }
    responses:
      "204":
        description: No Content. The article was updated successfully.
      "400":
        description: Bad Request. The request could not be processed due to invalid or missing query, path, or body parameters. Returns a standard error object.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Error"
      "404":
        description: Not Found. No article exists with the specified ID.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Error"

articles_articleId_file:
  get:
    tags: [articles]
    summary: Get article Markdown file
    description: |
      Retrieves the Markdown file content for the specified article.
    parameters:
      - name: articleId
        in: path
        required: true
        description: The unique identifier of the article.
        schema:
          $ref: "../components/schemas.yaml#/UUID"
    responses:
      "200":
        description: |-
          Success. Returns the Markdown file for the specified article.
        content:
          application/json:
            schema:
              type: object
              description: Markdown file content
              properties:
                file:
                  type: string
                  format: markdown
              required: [file]
      "400":
        description: Bad Request. The request could not be processed due to invalid or missing query, path, or body parameters. Returns a standard error object.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Error"
      "404":
        description: Not Found. No article exists with the specified ID.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Error"
  put:
    tags: [articles]
    summary: Upload or replace article Markdown file
    description: |
      Uploads or replaces the Markdown file for the specified article.
    parameters:
      - name: articleId
        in: path
        required: true
        description: The unique identifier of the article.
        schema:
          $ref: "../components/schemas.yaml#/UUID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              file:
                type: string
                format: markdown
                description: The Markdown file content to upload.
            required: [file]
    responses:
      "204":
        description: No Content. The file was uploaded successfully.
      "400":
        description: Bad Request. The request could not be processed due to invalid or missing path or file parameters. Returns a standard error object.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Error"
      "404":
        description: Not Found. No article exists with the specified ID.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Error"
