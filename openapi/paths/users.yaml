users:
  post:
    tags: [users]
    operationId: createUser
    summary: Create a new user account
    description: |
      Creates a new user account using Firebase authentication information. 
      The Google ID from the authentication token is used to prevent duplicate accounts.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/UserCreate'
    responses:
      '201':
        description: User account created successfully
        content:
          application/json:
            schema:
              type: object
              description: User creation response
              properties:
                userId:
                  $ref: '../components/schemas.yaml#/UUID'
              required: [userId]
      '400':
        description: Invalid request body or missing required fields
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '401':
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '409':
        description: User account already exists with this Google ID
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'

users_userId:
  get:
    tags: [users]
    summary: Get user profile by ID
    description: |
      Retrieves public profile information for a specific user using their unique identifier.
    parameters:
      - name: userId
        in: path
        required: true
        description: Unique identifier of the user whose profile to retrieve
        schema:
          $ref: '../components/schemas.yaml#/UUID'
    responses:
      '200':
        description: User profile retrieved successfully
        content:
          application/json:
            schema:
              type: object
              description: Public user profile response
              properties:
                user:
                  $ref: '../components/schemas.yaml#/UserResponse'
              required: [user]
      '400':
        description: Invalid user ID
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
  patch:
    tags: [users]
    summary: Update user profile by ID
    description: |
      Updates profile information for a specific user. Requires authentication 
      and appropriate permissions to modify the user account.
    security:
      - bearerAuth: []
    parameters:
      - name: userId
        in: path
        required: true
        description: Unique identifier of the user to update
        schema:
          $ref: '../components/schemas.yaml#/UUID'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/UserCreate'
    responses:
      '204':
        description: User profile updated successfully
      '400':
        description: Invalid user ID or request body
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '401':
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '403':
        description: Insufficient permissions to modify this user profile
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
users_me:
  get:
    tags: [users]
    summary: Get current user profile
    description: |
      Retrieves the public profile information for the currently authenticated user. 
      This is a convenience endpoint equivalent to GET /users/{userId} for the current user.
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Current user profile retrieved successfully
        content:
          application/json:
            schema:
              type: object
              description: Current user profile response
              properties:
                user:
                  $ref: '../components/schemas.yaml#/UserResponse'
              required: [user]
      '401':
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'

  patch:
    tags: [users]
    summary: Update current user profile
    description: |
      Updates the profile information for the currently authenticated user. 
      This is a convenience endpoint equivalent to PATCH /users/{userId} for the current user.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/UserCreate'
    responses:
      '204':
        description: Current user profile updated successfully
      '400':
        description: Invalid request body
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '401':
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'

users_me_private:
  get:
    tags: [users]
    summary: Get current user with private details
    description: |
      Retrieves the complete profile information for the currently authenticated user, 
      including private details like email address and Google ID that are not visible 
      in public profiles.
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Current user's complete profile retrieved successfully
        content:
          application/json:
            schema:
              type: object
              description: Complete user profile with private information
              properties:
                user:
                  $ref: '../components/schemas.yaml#/PrivateUserResponse'
              required: [user]
      '401':
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
