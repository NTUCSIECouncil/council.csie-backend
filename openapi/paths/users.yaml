users:
  post:
    tags: [users]
    operationId: createUser
    summary: Create a new user
    description: |
      Creates a new user with the provided data and information from Firebase. User authentication is required. If a user with the provided Google ID in the header already exists, the request will fail with a 409 Conflict error.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/UserCreate'
    responses:
      '201':
        description: |-
          Created. The user was successfully created. Returns the ID of the new user.
        content:
          application/json:
            schema:
              type: object
              description: User creation response
              properties:
                userId: { type: string }
      '400':
        description: Bad Request. The request could not be processed due to invalid or missing path or body parameters. Returns a standard error object.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '401':
        description: Unauthorized. The request requires authentication.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '409':
        description: Conflict. The user already exists with the provided Google ID.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'

users_userId:
  get:
    tags: [users]
    summary: Get user by ID
    description: |
      Retrieves a user by their unique ID.
    parameters:
      - name: userId
        in: path
        required: true
        description: The unique identifier of the user to retrieve.
        schema: { $ref: '../components/schemas.yaml#/UUID' }
    responses:
      '200':
        description: |-
          Success. Returns the user with the specified ID.
        content:
          application/json:
            schema:
              type: object
              description: User response
              properties:
                user: { $ref: '../components/schemas.yaml#/UserResponse' }
      '400':
        description: Bad Request. The request could not be processed due to invalid or missing path or body parameters. Returns a standard error object.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '403':
        description: Forbidden. You do not have permission to access or modify this user.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '404':
        description: Not Found. No user exists with the specified ID.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
  patch:
    tags: [users]
    summary: Update user by ID
    description: |
      Updates an existing user with the specified ID.
    security:
      - bearerAuth: []
    parameters:
      - name: userId
        in: path
        required: true
        description: The unique identifier of the user to update.
        schema: { $ref: '../components/schemas.yaml#/UUID' }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/UserCreate'
    responses:
      '204':
        description: No Content. The user was updated successfully.
      '400':
        description: Bad Request. The request could not be processed due to invalid or missing path or body parameters. Returns a standard error object.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '401':
        description: Unauthorized. The request requires authentication.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '403':
        description: Forbidden. You do not have permission to access or modify this user.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '404':
        description: Not Found. No user exists with the specified ID.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
