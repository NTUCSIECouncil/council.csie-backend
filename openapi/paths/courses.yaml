courses:
  get:
    tags: [courses]
    summary: List and search courses
    description: |
      Retrieves a paginated list of academic courses with keyword search support 
      for course names and lecturer information.
    parameters:
      - name: limit
        in: query
        description: Maximum number of courses to return per page
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: offset
        in: query
        description: Number of courses to skip for pagination
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: keyword
        in: query
        description: Search term for fuzzy matching against course names and lecturer names
        schema:
          type: string
    responses:
      '200':
        description: Courses retrieved successfully
        content:
          application/json:
            schema:
              type: object
              description: Paginated list of courses
              properties:
                courses:
                  type: array
                  description: Array of courses matching the search criteria
                  items:
                    $ref: '../components/schemas.yaml#/CourseResponse'
                meta:
                  $ref: '../components/schemas.yaml#/Meta'
              required: [courses, meta]
      '400':
        description: Invalid request parameters
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'

courses_courseId:
  get:
    tags: [courses]
    summary: Get course by ID
    description: |
      Retrieves detailed information about a specific course using its unique identifier.
    parameters:
      - name: courseId
        in: path
        required: true
        description: Unique identifier of the course to retrieve
        schema:
          $ref: '../components/schemas.yaml#/UUID'
    responses:
      '200':
        description: Course retrieved successfully
        content:
          application/json:
            schema:
              type: object
              description: Single course response
              properties:
                course:
                  $ref: '../components/schemas.yaml#/CourseResponse'
              required: [course]
      '400':
        description: Invalid course ID
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '404':
        description: Course not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'

courses_courseId_quizzes:
  get:
    tags: [courses, quizzes]
    summary: Get quizzes for a specific course
    description: |
      Retrieves a paginated list of quiz files associated with a specific course. 
      Can optionally embed related resources like course details and uploader information.
    parameters:
      - name: courseId
        in: path
        required: true
        description: Unique identifier of the course
        schema:
          $ref: '../components/schemas.yaml#/UUID'
      - name: limit
        in: query
        description: Maximum number of quizzes to return per page
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: offset
        in: query
        description: Number of quizzes to skip for pagination
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: embed
        in: query
        description: Related resources to include in the response (when omitted, only UUID references are returned)
        schema:
          type: array
          items:
            type: string
            enum: [course, uploader]
        style: form
        explode: true
    responses:
      '200':
        description: Quizzes retrieved successfully
        content:
          application/json:
            schema:
              type: object
              description: Paginated list of quizzes for a course
              properties:
                quizzes:
                  type: array
                  description: Array of quizzes associated with this course
                  items:
                    $ref: '../components/schemas.yaml#/QuizResponse'
                meta:
                  $ref: '../components/schemas.yaml#/Meta'
              required: [quizzes, meta]
      '400':
        description: Invalid course ID or request parameters
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '404':
        description: Course not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
