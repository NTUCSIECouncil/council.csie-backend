courses:
  get:
    tags: [courses]
    summary: Get or search courses
    description: |
      Retrieves a paginated list of courses. Supports keyword search in course name or lecturer. Includes pagination metadata.
    parameters:
      - name: limit
        in: query
        description: Maximum number of courses to return per page.
        schema: { type: integer, default: 10, minimum: 1 }
      - name: offset
        in: query
        description: Number of courses to skip before starting to collect the result set.
        schema: { type: integer, default: 0, minimum: 0 }
      - name: keyword
        in: query
        description: Fuzzy search term applied to course name or lecturer.
        schema: { type: string }
    responses:
      "200":
        description: |-
          Success. Returns a paginated list of courses matching the query parameters. Each course includes basic information.
        content:
          application/json:
            schema:
              type: object
              description: List response for courses
              properties:
                courses:
                  type: array
                  items:
                    $ref: "../components/schemas.yaml#/CourseResponse"
                meta:
                  $ref: "../components/schemas.yaml#/Meta"
      "400":
        description: Bad Request. The request could not be processed due to invalid or missing query or path parameters. Returns a standard error object.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Error"

courses_courseId:
  get:
    tags: [courses]
    summary: Get course by ID
    description: |
      Retrieves a single course by its unique ID.
    parameters:
      - name: courseId
        in: path
        required: true
        description: The unique identifier of the course to retrieve.
        schema: { type: string }
    responses:
      "200":
        description: |-
          Success. Returns the course with the specified ID.
        content:
          application/json:
            schema:
              type: object
              description: Course response
              properties:
                course: { $ref: "../components/schemas.yaml#/CourseResponse" }
      "400":
        description: Bad Request. The request could not be processed due to invalid or missing query or path parameters. Returns a standard error object.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Error"
      "404":
        description: Not Found. No course exists with the specified ID.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Error"

courses_courseId_quizzes:
  get:
    tags: [courses, quizzes]
    summary: Get quizzes for a course
    description: |
      Retrieves a paginated list of quizzes for the specified course. Supports embedding related resources (course, uploader). Includes pagination metadata.
    parameters:
      - name: courseId
        in: path
        required: true
        description: The unique identifier of the course.
        schema: { type: string }
      - name: limit
        in: query
        description: Maximum number of quizzes to return per page.
        schema: { type: integer, default: 10, minimum: 1 }
      - name: offset
        in: query
        description: Number of quizzes to skip before starting to collect the result set.
        schema: { type: integer, default: 0, minimum: 0 }
      - name: embed
        in: query
        description: Specifies which related resources to include in the response. If omitted, only their UUIDs are returned.
        schema:
          type: array
          items:
            type: string
            enum: [course, uploader]
        style: form
        explode: true
    responses:
      "200":
        description: |-
          Success. Returns a paginated list of quizzes for the specified course. Each quiz may include embedded resources if requested.
        content:
          application/json:
            schema:
              type: object
              description: List response for quizzes for a course
              properties:
                quizzes:
                  type: array
                  description: List of quizzes for the course
                  items:
                    $ref: "../components/schemas.yaml#/QuizResponse"
                meta:
                  $ref: "../components/schemas.yaml#/Meta"
      "400":
        description: Bad Request. The request could not be processed due to invalid or missing query or path parameters. Returns a standard error object.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Error"
      "404":
        description: Not Found. No course exists with the specified ID.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Error"
