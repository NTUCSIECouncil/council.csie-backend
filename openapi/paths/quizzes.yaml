quizzes:
  get:
    tags: [quizzes]
    summary: Get or search quizzes
    description: |
      Retrieves a paginated list of quizzes. Supports filtering and searching by query parameters. Optionally embeds related resources (course, uploader).
    parameters:
      - name: limit
        in: query
        schema: { type: integer, default: 10, minimum: 1 }
      - name: offset
        in: query
        schema: { type: integer, default: 0, minimum: 0 }
      - name: embed
        in: query
        description: Specifies which related resources to include in the response. If omitted, only their UUIDs are returned.
        schema:
          type: array
          items:
            type: string
            enum: [course, uploader]
        style: form
        explode: true
    responses:
      "200":
        description: |-
          Success. Returns a paginated list of quizzes matching the query parameters. Each quiz may include embedded resources if requested.
        content:
          application/json:
            schema:
              type: object
              description: List response for quizzes
              properties:
                quizzes:
                  type: array
                  description: List of quizzes
                  items:
                    $ref: "../components/schemas.yaml#/QuizResponse"
                meta:
                  $ref: "../components/schemas.yaml#/Meta"
      "400":
        description: Bad Request. The request could not be processed due to invalid or missing query, path, or body parameters. Returns a standard error object.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Error"

quizzes_quizId:
  get:
    tags: [quizzes]
    summary: Get quiz by ID
    description: |
      Retrieves a single quiz by its unique ID. Optionally embeds related resources (course, uploader).
    parameters:
      - name: quizId
        in: path
        required: true
        schema: { type: string }
      - name: embed
        in: query
        description: Specifies which related resources to include in the response. If omitted, only their UUIDs are returned.
        schema:
          type: array
          items:
            type: string
            enum: [course, uploader]
        style: form
        explode: true
    responses:
      "200":
        description: |-
          Success. Returns the quiz with the specified ID. May include embedded resources if requested.
        content:
          application/json:
            schema:
              type: object
              description: Quiz response
              properties:
                quiz:
                  $ref: "../components/schemas.yaml#/QuizResponse"
      "400":
        description: Bad Request. The request could not be processed due to invalid or missing query, path, or body parameters. Returns a standard error object.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Error"
      "404":
        description: Not Found. No quiz exists with the specified ID.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Error"

quizzes_quizId_file:
  get:
    tags: [quizzes]
    summary: Get quiz PDF file
    description: |
      Retrieves the PDF file content for the specified quiz.
    parameters:
      - name: quizId
        in: path
        required: true
        schema: { type: string }
    responses:
      "200":
        description: |-
          Success. Returns the PDF file for the specified quiz.
        content:
          application/pdf:
            schema:
              type: string
              format: binary
              description: PDF file content
      "400":
        description: Bad Request. The request could not be processed due to invalid or missing query, path, or body parameters. Returns a standard error object.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Error"
      "404":
        description: Not Found. No quiz exists with the specified ID or file is missing.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Error"
