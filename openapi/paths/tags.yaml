tags:
  get:
    tags: [tags]
    summary: Get all tags
    description: |
      Retrieves a paginated list of all available tags sorted. Includes pagination metadata.
    parameters:
      - name: limit
        in: query
        schema: { type: integer, default: 10, minimum: 1 }
        description: Maximum number of tags to return
      - name: offset
        in: query
        schema: { type: integer, default: 0, minimum: 0 }
        description: Number of tags to skip before starting to collect the result set
    responses:
      '200':
        description: |-
          Success. Returns a paginated list of all available tags.
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    type: string
                  description: List of tag names
                meta:
                  $ref: '../components/schemas.yaml#/Meta'
      '400':
        description: Bad Request. The request could not be processed due to invalid or missing query parameters. Returns a standard error object.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
