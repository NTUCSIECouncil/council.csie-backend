tags:
  get:
    tags: [tags]
    summary: List all available tags
    description: |
      Retrieves a paginated list of all tags used throughout the platform. 
      Results are sorted alphabetically for easy browsing.
    parameters:
      - name: limit
        in: query
        description: Maximum number of tags to return per page
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - name: offset
        in: query
        description: Number of tags to skip for pagination
        schema:
          type: integer
          default: 0
          minimum: 0
          maximum: 100
    responses:
      '200':
        description: Tags retrieved successfully
        content:
          application/json:
            schema:
              type: object
              description: Paginated list of tags
              properties:
                tags:
                  type: array
                  items:
                    type: string
                  description: Array of tag names sorted alphabetically
                  example:
                    - 'DSA'
                    - 'GOAT'
                    - 'algorithms'
                    - 'computer-science'
                    - 'cool'
                    - 'data-structures'
                meta:
                  $ref: '../components/schemas.yaml#/Meta'
              required: [tags, meta]
      '400':
        description: Invalid request parameters
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
