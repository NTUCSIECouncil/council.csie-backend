quizzes:
  get:
    tags: [quizzes]
    summary: List quiz files
    description: |
      Retrieves a paginated list of quiz and exam files. 
      Can optionally embed related resources like course details and uploader information.
    parameters:
      - name: limit
        in: query
        description: Maximum number of quizzes to return per page
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - name: offset
        in: query
        description: Number of quizzes to skip for pagination
        schema:
          type: integer
          default: 0
          minimum: 0
          maximum: 100
      - name: embed
        in: query
        description: Related resources to include in the response (when omitted, only UUID references are returned)
        schema:
          type: array
          items:
            type: string
            enum: [course, uploader]
        style: form
        explode: true
    responses:
      '200':
        description: Quizzes retrieved successfully
        content:
          application/json:
            schema:
              type: object
              description: Paginated list of quizzes
              properties:
                quizzes:
                  type: array
                  description: Array of available quiz files
                  items:
                    $ref: '../components/schemas.yaml#/QuizResponse'
                meta:
                  $ref: '../components/schemas.yaml#/Meta'
              required: [quizzes, meta]
      '400':
        description: Invalid request parameters
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'

quizzes_quizId:
  get:
    tags: [quizzes]
    summary: Get quiz by ID
    description: |
      Retrieves detailed information about a specific quiz using its unique identifier. 
      Can optionally embed related resources like course details and uploader information.
    parameters:
      - name: quizId
        in: path
        required: true
        description: Unique identifier of the quiz to retrieve
        schema:
          $ref: '../components/schemas.yaml#/UUID'
      - name: embed
        in: query
        description: Related resources to include in the response (when omitted, only UUID references are returned)
        schema:
          type: array
          items:
            type: string
            enum: [course, uploader]
        style: form
        explode: true
    responses:
      '200':
        description: Quiz retrieved successfully
        content:
          application/json:
            schema:
              type: object
              description: Single quiz response
              properties:
                quiz:
                  $ref: '../components/schemas.yaml#/QuizResponse'
              required: [quiz]
      '400':
        description: Invalid quiz ID or request parameters
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '404':
        description: Quiz not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'

quizzes_quizId_file:
  get:
    tags: [quizzes]
    summary: Download quiz PDF file
    description: |
      Downloads the actual PDF file content for the specified quiz or exam.
    parameters:
      - name: quizId
        in: path
        required: true
        description: Unique identifier of the quiz whose file to download
        schema:
          $ref: '../components/schemas.yaml#/UUID'
    responses:
      '200':
        description: Quiz PDF file retrieved successfully
        content:
          application/pdf:
            schema:
              type: string
              format: binary
              description: Binary PDF file content ready for download
      '400':
        description: Invalid quiz ID
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '404':
        description: Quiz or file not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
