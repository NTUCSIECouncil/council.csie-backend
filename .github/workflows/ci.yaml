name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run type-check

  prepare-samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci

      - name: Restore cached samples
        uses: actions/cache@v4
        id: samples-cache
        with:
          path: ./samples/
          key: samples-${{ hashFiles('package-lock.json', 'package.json', 'scripts/fetch-courses.ts', 'scripts/gen-samples.ts') }}
          restore-keys: |
            samples-

      - name: Populate sample files and database
        if: steps.samples-cache.outputs.cache-hit != 'true'
        run: npm run fetch-courses

      - name: Generate samples
        if: steps.samples-cache.outputs.cache-hit != 'true'
        run: npm run generate-samples

  test:
    runs-on: ubuntu-latest
    needs: prepare-samples
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci

      - name: Restore cached samples
        uses: actions/cache@v4
        id: samples-cache
        with:
          path: ./samples/
          key: samples-${{ hashFiles('package-lock.json', 'package.json', 'scripts/fetch-courses.ts', 'scripts/gen-samples.ts') }}
          restore-keys: |
            samples-

      - run: npm run test
