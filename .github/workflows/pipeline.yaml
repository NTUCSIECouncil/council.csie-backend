name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  ci-checks:
    name: CI Checks
    uses: ./.github/workflows/ci-checks.yaml

  docker-build:
    name: Docker Build
    needs: ci-checks
    uses: ./.github/workflows/docker-build.yaml
